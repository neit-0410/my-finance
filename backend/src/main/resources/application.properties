# default profile
spring.profiles.active=dev
security.jwt.secret=${FINANCE_JWT_SECRET}
security.jwt.expiration-ms=${FINANCE_JWT_EXPIRATION_MS:3600000}
server.error.include-message=never
server.error.include-stacktrace=never

# Reject fractional values for integer IDs and share quantities.
spring.jackson.deserialization.accept-float-as-int=false

# Optional read cache. A missing/unavailable Redis falls back to MySQL.
app.cache.enabled=${APP_CACHE_ENABLED:true}
app.cache.ttl-seconds=${APP_CACHE_TTL_SECONDS:60}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=250ms
spring.data.redis.timeout=250ms
spring.data.redis.repositories.enabled=false
spring.data.redis.password=${REDIS_PASSWORD:}
