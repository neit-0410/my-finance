# default profile
spring.profiles.active=dev
security.jwt.secret=${FINANCE_JWT_SECRET}
security.jwt.expiration-ms=${FINANCE_JWT_EXPIRATION_MS:3600000}
server.error.include-message=never
server.error.include-stacktrace=never

# Reject fractional values for integer IDs and share quantities.
spring.jackson.deserialization.accept-float-as-int=false
