services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance_db}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [finance-network]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -uroot -h127.0.0.1 -D"$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [finance-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping:1}).ok !== 1) quit(1)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
    command: ["sh", "-c", 'exec redis-server --bind 0.0.0.0 --protected-mode yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no']
    networks: [finance-network]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_CACHE_TTL_SECONDS: ${APP_CACHE_TTL_SECONDS:-60}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-finance_db}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your env file}
      SPRING_MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-finance_db}
      FINANCE_JWT_SECRET: ${FINANCE_JWT_SECRET:-}
      FINANCE_JWT_EXPIRATION_MS: ${FINANCE_JWT_EXPIRATION_MS:-3600000}
    expose: ["8080"]
    networks: [finance-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    networks: [finance-network]

volumes:
  mysql_data:
  mongo_data:
networks:
  finance-network:
    driver: bridge
