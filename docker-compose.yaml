services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance_db}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [finance-network]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -uroot -h127.0.0.1 -D"$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [finance-network]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping:1}).ok !== 1) quit(1)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-finance_db}?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your env file}
      SPRING_MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-finance_db}
      FINANCE_JWT_SECRET: ${FINANCE_JWT_SECRET:-}
      FINANCE_JWT_EXPIRATION_MS: ${FINANCE_JWT_EXPIRATION_MS:-3600000}
    expose: ["8080"]
    networks: [finance-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    networks: [finance-network]

volumes:
  mysql_data:
  mongo_data:
networks:
  finance-network:
    driver: bridge
